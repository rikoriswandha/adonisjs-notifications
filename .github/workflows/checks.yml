name: checks

on:
  - push
  - pull_request
  - workflow_call

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Run lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Run typecheck
        run: npm run typecheck

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Run tests
        run: npm test

  peer-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and build package
        run: |
          npm install
          npm run build
      - name: Pack package
        run: npm pack
      - name: Verify supported optional peers in a consumer project
        run: |
          mkdir ../consumer
          cd ../consumer
          npm init --yes
          npm install ../adonisjs-notifications/rikology-adonisjs-notifications-*.tgz @adonisjs/core@^7.0.0 @adonisjs/mail@^10.0.0 @adonisjs/queue@^0.6.2
          npm ls @rikology/adonisjs-notifications @adonisjs/core @adonisjs/mail @adonisjs/queue
